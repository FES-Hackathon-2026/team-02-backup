<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover lets the app paint under the iOS notch / home bar;
         the CSS then pays it back with env(safe-area-inset-*) padding. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Save2Share</title>
    <meta name="description" content="Find food rescues that are already on your way. Rescue minus travel." />

    <!-- PWA: installable on Android (manifest) and iOS (apple-* meta) -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0f7a5a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1310" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- iOS home-screen behaviour: iOS ignores the manifest for these -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Save2Share" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
