<div class="scr" style="background:#0B131A">
  <!-- viewfinder: a stylised street scene, not a photo placeholder -->
  <div style="position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 24%, #1E2F3C 0%, #111C25 58%, #080F15 100%)"></div>
  <div style="position:absolute;left:0;right:0;bottom:214px;height:150px;background:#16242E"></div>
  <div style="position:absolute;left:0;right:0;bottom:352px;height:9px;background:#21323F"></div>
  <div style="position:absolute;left:62px;bottom:362px;width:266px;height:104px">
    <div style="position:absolute;left:0;bottom:0;width:266px;height:62px;border-radius:12px 12px 6px 6px;background:#6B5F55"></div>
    <div style="position:absolute;left:10px;bottom:40px;width:246px;height:58px;border-radius:12px;background:#7A6D61"></div>
    <div style="position:absolute;left:0;bottom:22px;width:34px;height:78px;border-radius:12px;background:#5C524A"></div>
    <div style="position:absolute;right:0;bottom:22px;width:34px;height:78px;border-radius:12px;background:#5C524A"></div>
    <div style="position:absolute;left:50px;bottom:54px;width:78px;height:40px;border-radius:9px;background:#877A6D"></div>
    <div style="position:absolute;left:138px;bottom:54px;width:78px;height:40px;border-radius:9px;background:#877A6D"></div>
  </div>

  <header class="nav" style="background:transparent;position:relative;z-index:2">
    <button class="icobtn" style="background:rgba(9,16,22,.5);border-color:rgba(255,255,255,.16);color:#fff">{{ico:cross,21}}</button>
    <div class="grow"></div>
    <button class="icobtn" style="background:rgba(9,16,22,.5);border-color:rgba(255,255,255,.16);color:#fff">{{ico:info,21}}</button>
  </header>

  <!-- framing corners -->
  <div style="position:absolute;left:40px;right:40px;top:132px;height:316px;z-index:2">
    <div style="position:absolute;left:0;top:0;width:38px;height:38px;border-top:3px solid #fff;border-left:3px solid #fff;border-radius:14px 0 0 0"></div>
    <div style="position:absolute;right:0;top:0;width:38px;height:38px;border-top:3px solid #fff;border-right:3px solid #fff;border-radius:0 14px 0 0"></div>
    <div style="position:absolute;left:0;bottom:0;width:38px;height:38px;border-bottom:3px solid #fff;border-left:3px solid #fff;border-radius:0 0 0 14px"></div>
    <div style="position:absolute;right:0;bottom:0;width:38px;height:38px;border-bottom:3px solid #fff;border-right:3px solid #fff;border-radius:0 0 14px 0"></div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;z-index:3;padding:52px 18px 26px;display:flex;flex-direction:column;gap:16px;background:linear-gradient(180deg, rgba(8,15,21,0) 0%, rgba(8,15,21,.88) 34%)">
    <div class="row" style="justify-content:center;gap:7px;color:#C6DAE8;font-size:12.5px;font-weight:600">
      {{ico:spark,16,1.9}}Ganzes Objekt ins Bild — den Rest übernimmt ReMain
    </div>

    <div class="chips" style="justify-content:center">
      <span class="chip on">Sperrmüll</span>
      <span class="chip" style="background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.2);color:#DCE9F2">Fundstück melden</span>
      <span class="chip" style="background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.2);color:#DCE9F2">Was ist das?</span>
    </div>

    <div class="between" style="padding:0 18px">
      <span style="width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#DCE9F2">{{ico:market,21}}</span>
      <span style="width:74px;height:74px;border-radius:50%;border:4px solid rgba(255,255,255,.32);display:flex;align-items:center;justify-content:center">
        <span style="width:58px;height:58px;border-radius:50%;background:#fff"></span>
      </span>
      <span style="width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#DCE9F2">{{ico:scan,21}}</span>
    </div>

    <p class="xs" style="margin:0;text-align:center;color:#8499A8">Das Foto bleibt auf dem Gerät, bis du eine Aktion bestätigst.</p>
  </div>
</div>
