<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
  <style>
/* ReMain — "Mainwasser" design system.
   Pastel river blue on cool paper, deep navy ink, yellow reserved for rewards.
   Provenance colours are load-bearing: confirmed / stated / estimated must
   never be confusable, because the brief requires them to be separated. */
:root {
  --paper: #F1F5F8;
  --card: #FFFFFF;
  --ink: #10202C;
  --ink2: #526575;
  --ink3: #8C9CA8;
  --line: #DBE5EC;
  --blue: #7FA8C4;
  --blue-deep: #1F5C82;
  --blue-ink: #14435F;
  --sky: #D6E6F1;
  --sky2: #EAF2F8;
  --gold: #E3A81C;
  --gold-ink: #8A6410;
  --gold-soft: #FBF0D4;
  --slate: #5F6280;
  --slate-soft: #ECEEF5;
  --stone: #7C6F61;
  --stone-soft: #F1EDE7;
  --alert: #B03A2B;
  --alert-soft: #FAE7E3;
  --sh: 0 1px 1px rgba(16,32,44,.04), 0 6px 18px rgba(16,32,44,.06);
  --r: 18px;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-family: 'Schibsted Grotesk', 'Segoe UI', system-ui, sans-serif; }
a { color: var(--blue-deep); text-decoration: none; }
a:hover { color: var(--blue-ink); }
svg { display: block; }

/* ---------- shell ---------- */
.scr {
  width: 390px; height: 844px; background: var(--paper); color: var(--ink);
  display: flex; flex-direction: column; overflow: hidden; position: relative;
  font-size: 14px; line-height: 1.42; letter-spacing: -0.005em;
}
.nav {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 18px 12px; background: var(--paper);
}
.nav.solid { background: var(--card); border-bottom: 1px solid var(--line); }
.nav-t { flex: 1; min-width: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
.nav-t small { display: block; font-size: 12px; font-weight: 500; color: var(--ink2); letter-spacing: 0; }
.icobtn {
  width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); background: var(--card); border-radius: 14px; color: var(--ink);
  padding: 0; cursor: pointer;
}
.body { flex: 1; min-height: 0; overflow: hidden; padding: 2px 18px 14px; display: flex; flex-direction: column; gap: 14px; }
.body.flush { padding-left: 0; padding-right: 0; }

/* ---------- tab bar ---------- */
.tabs {
  flex: none; height: 78px; background: var(--card); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: start;
  padding: 9px 6px 0; position: relative;
}
.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink3); font-size: 10.5px; font-weight: 600; }
.tab.on { color: var(--blue-deep); }
.tab-fab {
  width: 54px; height: 54px; border-radius: 50%; background: var(--blue-deep); color: #fff;
  display: flex; align-items: center; justify-content: center; margin-top: -20px;
  box-shadow: 0 6px 16px rgba(31,92,130,.34); border: 3px solid var(--card);
}

/* ---------- surfaces ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh); padding: 15px; }
.card.tight { padding: 13px; }
.card.flat { box-shadow: none; }
.card.sky { background: var(--sky2); border-color: #CFE2EE; box-shadow: none; }
.sheet {
  background: var(--card); border-radius: 24px 24px 0 0; border-top: 1px solid var(--line);
  box-shadow: 0 -8px 28px rgba(16,32,44,.10); padding: 8px 18px 16px; margin-top: auto;
}
.grab { width: 38px; height: 4px; border-radius: 4px; background: #CFDCE5; margin: 0 auto 12px; }

/* ---------- type ---------- */
.h1 { font-family: 'Bricolage Grotesque', 'Schibsted Grotesk', system-ui, sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.03em; margin: 0; }
.h2 { font-size: 16px; font-weight: 700; letter-spacing: -0.015em; margin: 0; }
.h3 { font-size: 14px; font-weight: 700; margin: 0; }
.lbl { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink3); margin: 0; }
.mut { color: var(--ink2); }
.sm { font-size: 12.5px; }
.xs { font-size: 11.5px; }
.num { font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }

/* ---------- bits ---------- */
.row { display: flex; align-items: center; gap: 10px; }
.col { display: flex; flex-direction: column; gap: 10px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.chips { display: flex; gap: 7px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 13px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--card);
  font-size: 12.5px; font-weight: 600; color: var(--ink2); white-space: nowrap;
}
.chip.on { background: var(--blue-deep); border-color: var(--blue-deep); color: #fff; }
.chip.soft { background: var(--sky); border-color: #C6DCEC; color: var(--blue-ink); }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 18px;
  border-radius: 15px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%;
}
.btn.primary { background: var(--blue-deep); border-color: var(--blue-deep); color: #fff; }
.btn.sm { height: 40px; font-size: 13.5px; border-radius: 12px; width: auto; padding: 0 14px; }
.tag {
  display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 8px; border-radius: 6px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .02em; white-space: nowrap;
}
.tag.api { background: var(--sky); color: var(--blue-ink); }
.tag.inp { background: var(--slate-soft); color: var(--slate); }
.tag.est { background: var(--stone-soft); color: var(--stone); }
.tag.warn { background: var(--alert-soft); color: var(--alert); }
.dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.coin {
  display: inline-flex; align-items: center; gap: 5px; height: 25px; padding: 0 9px 0 7px; border-radius: 999px;
  background: var(--gold-soft); color: var(--gold-ink); font-size: 12.5px; font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.bar { height: 8px; border-radius: 99px; background: var(--sky); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--blue-deep); }
.thumb { border-radius: 13px; background: var(--sky); border: 1px solid #CFE2EE; overflow: hidden; position: relative; flex: none; }
.sep { height: 1px; background: var(--line); }
.ico { color: var(--ink2); flex: none; }
  </style>
</helmet>
<div class="scr" style="background:#0B131A">
  <!-- viewfinder: a stylised street scene, not a photo placeholder -->
  <div style="position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 24%, #1E2F3C 0%, #111C25 58%, #080F15 100%)"></div>
  <div style="position:absolute;left:0;right:0;bottom:214px;height:150px;background:#16242E"></div>
  <div style="position:absolute;left:0;right:0;bottom:352px;height:9px;background:#21323F"></div>
  <div style="position:absolute;left:62px;bottom:362px;width:266px;height:104px">
    <div style="position:absolute;left:0;bottom:0;width:266px;height:62px;border-radius:12px 12px 6px 6px;background:#6B5F55"></div>
    <div style="position:absolute;left:10px;bottom:40px;width:246px;height:58px;border-radius:12px;background:#7A6D61"></div>
    <div style="position:absolute;left:0;bottom:22px;width:34px;height:78px;border-radius:12px;background:#5C524A"></div>
    <div style="position:absolute;right:0;bottom:22px;width:34px;height:78px;border-radius:12px;background:#5C524A"></div>
    <div style="position:absolute;left:50px;bottom:54px;width:78px;height:40px;border-radius:9px;background:#877A6D"></div>
    <div style="position:absolute;left:138px;bottom:54px;width:78px;height:40px;border-radius:9px;background:#877A6D"></div>
  </div>

  <header class="nav" style="background:transparent;position:relative;z-index:2">
    <button class="icobtn" style="background:rgba(9,16,22,.5);border-color:rgba(255,255,255,.16);color:#fff"><svg class="ico" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6.6 6.6 10.8 10.8M17.4 6.6 6.6 17.4"/></svg></button>
    <div class="grow"></div>
    <button class="icobtn" style="background:rgba(9,16,22,.5);border-color:rgba(255,255,255,.16);color:#fff"><svg class="ico" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.4M12 7.8v.2"/></svg></button>
  </header>

  <!-- framing corners -->
  <div style="position:absolute;left:40px;right:40px;top:132px;height:316px;z-index:2">
    <div style="position:absolute;left:0;top:0;width:38px;height:38px;border-top:3px solid #fff;border-left:3px solid #fff;border-radius:14px 0 0 0"></div>
    <div style="position:absolute;right:0;top:0;width:38px;height:38px;border-top:3px solid #fff;border-right:3px solid #fff;border-radius:0 14px 0 0"></div>
    <div style="position:absolute;left:0;bottom:0;width:38px;height:38px;border-bottom:3px solid #fff;border-left:3px solid #fff;border-radius:0 0 0 14px"></div>
    <div style="position:absolute;right:0;bottom:0;width:38px;height:38px;border-bottom:3px solid #fff;border-right:3px solid #fff;border-radius:0 0 14px 0"></div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;z-index:3;padding:52px 18px 26px;display:flex;flex-direction:column;gap:16px;background:linear-gradient(180deg, rgba(8,15,21,0) 0%, rgba(8,15,21,.88) 34%)">
    <div class="row" style="justify-content:center;gap:7px;color:#C6DAE8;font-size:12.5px;font-weight:600">
      <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3.4 1.9 5.1 5.1 1.9-5.1 1.9L12 17.4l-1.9-5.1L5 10.4l5.1-1.9z"/><path d="m18.4 15.6.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>Ganzes Objekt ins Bild — den Rest übernimmt ReMain
    </div>

    <div class="chips" style="justify-content:center">
      <span class="chip on">Sperrmüll</span>
      <span class="chip" style="background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.2);color:#DCE9F2">Fundstück melden</span>
      <span class="chip" style="background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.2);color:#DCE9F2">Was ist das?</span>
    </div>

    <div class="between" style="padding:0 18px">
      <span style="width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#DCE9F2"><svg class="ico" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.8 8.2h14.4l-1.1 12.3H5.9z"/><path d="M9 8.2V6a3 3 0 0 1 6 0v2.2"/></svg></span>
      <span style="width:74px;height:74px;border-radius:50%;border:4px solid rgba(255,255,255,.32);display:flex;align-items:center;justify-content:center">
        <span style="width:58px;height:58px;border-radius:50%;background:#fff"></span>
      </span>
      <span style="width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#DCE9F2"><svg class="ico" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.6 8.4V5.8a2.2 2.2 0 0 1 2.2-2.2h2.6M15.6 3.6h2.6a2.2 2.2 0 0 1 2.2 2.2v2.6M20.4 15.6v2.6a2.2 2.2 0 0 1-2.2 2.2h-2.6M8.4 20.4H5.8a2.2 2.2 0 0 1-2.2-2.2v-2.6"/></svg></span>
    </div>

    <p class="xs" style="margin:0;text-align:center;color:#8499A8">Das Foto bleibt auf dem Gerät, bis du eine Aktion bestätigst.</p>
  </div>
</div>
</x-dc>
</body>
