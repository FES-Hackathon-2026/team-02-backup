# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Use this INSTEAD of vercel.json, not alongside it. Connect the repo under
# Render -> New -> Blueprint and it picks this file up automatically.
#
# Static sites on Render's free tier do not spin down (that only affects web
# services) and deploy from private repositories.

services:
  - type: web
    name: save2share
    runtime: static
    rootDir: app
    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    envVars:
      # Render serves from the domain root, unlike GitHub Pages (/team-02/).
      - key: BASE_PATH
        value: /
      # sync: false means "prompt me in the dashboard, do not store it here".
      # Leave it unset and the app asks each visitor for a key instead.
      - key: VITE_FS_API_KEY
        sync: false

    # Harmless today (tab state only, no router). Keeps deep links working if
    # react-router is added later.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
