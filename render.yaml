# Render Blueprint — https://render.com/docs/blueprint-spec
#
# ONE web service that runs the API and serves the built client from the same
# origin. Not a static site: ReMain has a backend (server/), and a static
# deploy gives you a frontend where every /api call 404s.
#
# Connect the repo under Render -> New -> Blueprint; this file is picked up
# automatically.
#
# Two things to know about the free plan before demo day:
#
#   1. A free web service SPINS DOWN after 15 minutes idle and takes ~50s to
#      wake. Open the URL five minutes before you present.
#   2. Free plans have no persistent disk, so the SQLite file is lost on every
#      redeploy and the seed rebuilds it. Reference data (districts, the 1011
#      real OSM places) comes back identically; anything a judge did during a
#      live demo does not. DO NOT REDEPLOY WHILE THE JURY IS TESTING.
#      To keep data across deploys, add a disk (paid) and point DATABASE_FILE
#      at its mount path.

services:
  - type: web
    name: remain
    runtime: node
    plan: free
    region: frankfurt
    # The client is built first, then the server serves app/dist from the same
    # origin — which is why there is no CORS config anywhere in this project.
    buildCommand: >-
      cd app && npm ci && npm run build &&
      cd ../server && npm ci
    startCommand: cd server && npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # Signs the session cookie. generateValue makes Render create a random
      # one and keep it — never put a real secret in this file.
      - key: SESSION_SECRET
        generateValue: true

      # The foodsharing team key. Server-side only: it used to be
      # VITE_FS_API_KEY, which Vite compiled into the public bundle.
      # sync: false means "prompt me in the dashboard, do not store it here".
      - key: FS_API_KEY
        sync: false
      - key: FS_API_BASE
        value: https://app-foodsharing-hackathon.azurewebsites.net

      # The Vytal store token. It identifies one store location, which is
      # what lets ReMain hand out and take back containers at all — and why
      # it must never reach the browser. sync: false = prompt in the dashboard.
      - key: VYTAL_JWT
        sync: false
      - key: VYTAL_API_BASE
        value: https://merchantapi.vytal.org
      # Public store directory — no token, header is literally ANONYMOUS.
      - key: VYTAL_GRAPHQL_BASE
        value: https://colugo.vytal.org/
      - key: VYTAL_STORE_NAME
        value: ReMain-Station Frankfurt

      # Google sign-in. The SERVER only needs the project id, which is
      # public — it verifies ID tokens against Google's published keys, so
      # there is no service-account secret to store here.
      #
      # The CLIENT half is different: Vite inlines VITE_* at BUILD time, so
      # these must exist when buildCommand runs, not just at start-up.
      # Render exposes env vars to the build, so setting them here is
      # enough. sync: false = prompt me in the dashboard.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false

      # Where demo content is seeded. Set these to the hackathon room before
      # the jury arrives, or they open an empty map.
      - key: VENUE_LAT
        value: "50.1109"
      - key: VENUE_LON
        value: "8.6821"

      # Vision model for the scan agent. Groq is the only provider that looks
      # at the photo; without GROQ_API_KEY the server falls back to the
      # offline fixtures and every answer says so. Set LLM_PROVIDER=mock to
      # force fixtures deliberately.
      - key: LLM_PROVIDER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_VISION_MODEL
        sync: false
